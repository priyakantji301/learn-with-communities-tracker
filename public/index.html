<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learn With Communities · GDG on Campus</title>
<script>try{document.documentElement.dataset.theme=localStorage.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch{document.documentElement.dataset.theme="light"}</script>
<style>
:root{--bg:#f5f6f8;--sf:#fff;--tx:#1d2128;--mu:#5c6472;--ln:#e2e5ea;--ac:#1a5fd0;--gr:#17703a;--gs:#e3f3e8;--am:#9a5b00;--as:#fdeed1;--rd:#b3261e;--rs:#fbe6e4;--ng:#eaedf1}
@media all{:root[data-theme=dark]{--bg:#0f1114;--sf:#171a1f;--tx:#e7e9ed;--mu:#9aa1ad;--ln:#282c33;--ac:#8ab4f8;--gr:#7fcf9a;--gs:#15301f;--am:#f2c86b;--as:#352a0e;--rd:#f4968f;--rs:#38171a;--ng:#22262d}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body,aside,.card,.stat,input,select,textarea,dialog,.btn,aside a,.chip,.bar i{transition:background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease,width .5s ease}
.btn:active{transform:scale(.97)}.card,.stat{box-shadow:0 1px 2px #0000000d}.btn:hover{box-shadow:0 2px 8px #00000014}tbody tr:hover td{background:var(--bg)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}main>*{animation:in .3s ease both}dialog[open]{animation:in .2s ease both}#toast{animation:in .2s ease both}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}body{margin:0;display:flex;min-height:100vh;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
aside{width:232px;flex:none;background:var(--sf);border-right:1px solid var(--ln);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{padding:0 6px 14px}.brand img{width:100%;max-width:150px;border-radius:12px;display:block}.brand .lgd{display:none}[data-theme=dark] .brand .lgd{display:block}[data-theme=dark] .brand .lgl{display:none}
.hero{width:100%;border-radius:12px;display:block;margin-bottom:14px;aspect-ratio:1440/499;object-fit:cover}.stage{background:#fff;border-radius:12px;display:block;margin:0 auto 10px}.empty .stage{max-width:300px;width:100%}.slide{height:60px;float:right;margin:-6px 0 0 10px}
.ct{display:flex;flex-direction:column;gap:6px;margin:8px 0}.ct a{padding:7px 10px;border:1px solid var(--ln);border-radius:8px;color:var(--tx);font-size:13px;text-align:center}.ct a:hover{border-color:var(--ac)}
@media(prefers-reduced-motion:reduce){.anim{display:none}}
aside a{padding:9px 12px;border-radius:8px;color:var(--mu);text-decoration:none;font-weight:500}aside a.on{background:var(--ac);color:#fff}aside a:hover:not(.on){background:var(--ng)}
.camp{margin-top:auto;padding:10px;color:var(--mu);font-size:12px;border-top:1px solid var(--ln)}.camp b{color:var(--tx);display:block;font-size:13px}
main{flex:1;min-width:0;padding:24px 28px;max-width:1320px}
h1{margin:0;font-size:22px}h2{margin:0 0 12px;font-size:15px}.sub{color:var(--mu);margin:2px 0 0}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-start}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn,input,select,textarea{font:inherit;color:var(--tx)}.btn{padding:7px 13px;border:1px solid var(--ln);background:var(--sf);border-radius:8px;cursor:pointer}.btn:hover{border-color:var(--ac)}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.d{color:var(--rd)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.s{padding:3px 8px;font-size:12px}
input,select,textarea{padding:7px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);max-width:100%}:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.stat{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px}.stat span{color:var(--mu);font-size:12px}.stat b{display:block;font-size:26px;margin-top:4px}
.bar{height:8px;border-radius:9px;background:var(--ng);overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--ac)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mu);padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}td{padding:10px;border-bottom:1px solid var(--ln);vertical-align:top}td small{display:block;color:var(--mu)}.w{overflow-x:auto}
.chip{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap}.completed{background:var(--gs);color:var(--gr)}.in_progress{background:var(--as);color:var(--am)}.not_started,.unchecked{background:var(--ng);color:var(--mu)}.errors{background:var(--rs);color:var(--rd)}
.err{color:var(--rd);font-size:12px;max-width:320px;margin-top:4px}.act{display:flex;gap:4px;flex-wrap:wrap}
.banner{background:var(--as);color:var(--am);border-radius:8px;padding:9px 12px;margin-bottom:14px}.empty{padding:36px;text-align:center;color:var(--mu)}
dialog{border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--tx);padding:20px;width:min(760px,94vw);max-height:90vh}dialog::backdrop{background:#0008}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.g2 input,.g2 select{width:100%}
#toast{position:fixed;right:18px;bottom:18px;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:8px;display:none;max-width:420px}
@media(max-width:800px){aside{display:none}main{padding:14px}.g2{grid-template-columns:1fr}}
</style></head><body>
<aside>
  <div class="brand"><img class="lgl" src="/assets/logo-light.png" alt="Google Developer Group on Campus"><img class="lgd" src="/assets/logo-dark.png" alt="Google Developer Group on Campus"></div>
  <a href="#/dashboard">Dashboard</a><a href="#/students">Students</a><a href="#/verification">Verification</a><a href="#/reports">Reports</a><a href="#/settings">Settings</a>
  <div class="camp"><button class="btn s" data-a="theme" id="th" style="width:100%;margin-bottom:10px"></button><b>Learn With Communities</b>Target: <span id="tg">10</span> skill badges</div>
</aside>
<main id="v"></main><dialog id="dlg"></dialog><div id="toast"></div>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LBL={completed:'Completed',in_progress:'In progress',not_started:'Not started',errors:'Errors',unchecked:'Unchecked'};
const FILT=[['all','All statuses'],['completed','Completed'],['in_progress','In progress'],['not_started','Not started'],['errors','Errors'],['unchecked','Unchecked']];
let S=[],C={},J={},R='',filt='all',q='',page=1,tm;
const api=async(p,o={})=>{const r=await fetch('/api'+p,{headers:{'Content-Type':'application/json'},...o,body:o.body&&JSON.stringify(o.body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||r.statusText);return d};
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(tm);tm=setTimeout(()=>t.style.display='none',4000)};
const go=f=>async(...a)=>{try{return await f(...a)}catch(e){toast(e.message)}};
const T=d=>d?new Date(d).toLocaleString([],{timeZone:C.utc?'UTC':undefined,dateStyle:'medium',timeStyle:'short'})+(C.utc?' UTC':''):'Never';
const chip=s=>`<span class="chip ${s.status}">${LBL[s.status]}</span>`;
const cnt=()=>{const c={all:S.length};for(const k in LBL)c[k]=S.filter(s=>s.status===k).length;return c};
const match=s=>(filt==='all'||s.status===filt)&&(!q||[s.name,s.email,s.studentId,s.url,s.notes].join(' ').toLowerCase().includes(q.toLowerCase()));
const dl=(name,text)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click()};
const demo=()=>C.demo?'<div class="banner"><b>Demo mode is on.</b> Results are simulated from the mock CSV and are not real Google Skills data. Turn it off in Settings before verifying real students.</div>':'';
const prog=()=>J.state==='idle'&&!J.total?'':`<div class="card"><div class="row" style="justify-content:space-between"><b>${{running:'Verifying…',paused:'Paused',idle:'Last batch finished'}[J.state]}</b><span>${J.done}/${J.total} done · ${J.failed} failed · ${J.queued} queued${J.slow>1.2?' · slowed (rate limit)':''}</span></div><div class="bar" style="margin-top:8px"><i style="width:${J.total?J.done/J.total*100:0}%"></i></div></div>`;
const verify=go(async scope=>{const r=await api('/verify',{method:'POST',body:{scope}});toast(r.queued?`Queued ${r.queued} students`+(r.skippedInvalid?` (${r.skippedInvalid} invalid URLs need editing)`:''):'Nothing to verify');await load()});

const P={
dashboard:{mount:()=>`<div class="top"><div><h1>Dashboard</h1><p class="sub">Learn With Communities${C.chapter?' · '+esc(C.chapter):''}</p></div><div class="row"><button class="btn" data-a="refresh">Refresh</button><button class="btn p" data-a="vall">Verify All</button></div></div><picture><source media="(max-width:700px)" srcset="/assets/GDG-Campus-Digital-LandingPageHeader-640x500-Blue.jpg"><source media="(min-width:1500px)" srcset="/assets/GDG-Campus-Digital-LandingPageHeader-2650x500-Blue.jpg"><img class="hero" src="/assets/GDG-Campus-Digital-LandingPageHeader-1440x500-Blue.jpg" alt="GDG on Campus"></picture><div id="d"></div>`,
 update:()=>{const c=cnt(),r=c.all?Math.round(c.completed/c.all*100):0;$('d').innerHTML=demo()+prog()+`<div class="stats">${[['Total students',c.all],['Completed',c.completed],['Completion rate',r+'%'],['In progress',c.in_progress],['Not started',c.not_started],['Errors',c.errors],['Unchecked',c.unchecked]].map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('')}</div>`+(c.all?'':'<div class="card empty"><img class="stage anim" src="/assets/GDG-Sticker-Assembly.gif" alt="">No students yet. Upload a CSV on the Students page.</div>')}},
students:{mount:()=>`<div class="top"><div><h1>Students</h1><p class="sub" id="ss"></p></div><div class="row"><button class="btn p" data-a="up">Upload CSV</button><button class="btn" data-a="tpl">Download Template</button><button class="btn" data-a="add">Add Student</button><button class="btn" data-a="exp">Export</button></div></div><div class="row" style="margin-bottom:12px"><input id="q" type="search" placeholder="Search name, email, ID, notes" value="${esc(q)}" style="min-width:260px"><select id="f">${FILT.map(([v,l])=>`<option value="${v}"${v===filt?' selected':''}>${l}</option>`).join('')}</select></div><div id="d"></div>`,
 update:()=>{const c=cnt(),L=S.filter(match),ps=C.pageSize||25,pg=Math.max(1,Math.min(page,Math.ceil(L.length/ps)||1));page=pg;$('ss').textContent=`${L.length} of ${S.length} shown`;
  $('d').innerHTML=demo()+prog()+(L.length?`<div class="card w"><table><thead><tr><th>Student</th><th>Progress</th><th>Status</th><th>Last checked</th><th>Attempts</th><th></th></tr></thead><tbody>${L.slice((pg-1)*ps,pg*ps).map(s=>`<tr data-id="${s.id}"><td><b>${esc(s.name||'(no name)')}</b><small>${esc(s.studentId)} ${esc(s.email)}</small></td><td><div class="row"><div class="bar" style="width:90px"><i style="width:${Math.min(100,(s.badgeCount||0)/C.target*100)}%"></i></div>${s.badgeCount??'–'}/${C.target}</div></td><td>${chip(s)}${s.simulated?' <small>simulated</small>':''}${s.checking?' <small>checking…</small>':s.queued?' <small>queued</small>':''}${s.error?`<div class="err"><b>${esc(s.error.code)}</b>: ${esc(s.error.message)}</div>`:''}</td><td>${T(s.lastCheckedAt)}</td><td>${s.attempts||0}</td><td class="act"><a class="btn s" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">View Profile</a><button class="btn s" data-a="v1">Verify Again</button><button class="btn s" data-a="hist">History</button><button class="btn s" data-a="edit">Edit</button><button class="btn s d" data-a="rm">Remove</button></td></tr>`).join('')}</tbody></table><div class="row" style="margin-top:10px"><button class="btn s" data-a="pv"${pg<2?' disabled':''}>Previous</button>Page ${pg} of ${Math.ceil(L.length/ps)}<button class="btn s" data-a="nx"${pg*ps>=L.length?' disabled':''}>Next</button></div></div>`:`<div class="card empty">${S.length?'':'<img class="stage anim" src="/assets/GDG-Sticker-Brackets.gif" alt="">'}${S.length?'No students match this search or filter.':'No students yet. Upload a CSV or add a student.'}</div>`)}},
verification:{mount:()=>`<div class="top"><div><h1>Verification</h1><p class="sub">Checks run through one shared rate limiter with bounded retries.</p></div></div><div id="d"></div>`,
 update:()=>{const c=cnt(),st=J.state;$('d').innerHTML=demo()+`<div class="card"><div class="row"><select id="sc"><option value="unchecked">Unchecked only (${c.unchecked})</option><option value="all">All students (${c.all})</option></select><button class="btn p" data-a="start"${st!=='idle'?' disabled':''}>Start</button><button class="btn" data-a="pause"${st!=='running'?' disabled':''}>Pause</button><button class="btn" data-a="resume"${st!=='paused'?' disabled':''}>Resume</button><button class="btn" data-a="vf"${st!=='idle'||!c.errors?' disabled':''}>Recheck Failed (${c.errors})</button><button class="btn d" data-a="cancel"${st==='idle'?' disabled':''}>Cancel</button></div></div>`+(J.state==='running'?'<img class="stage anim slide" src="/assets/GDG-Sticker-Slider.gif" alt="">':'')+(J.total?prog():'<div class="card empty">No batch yet. Choose a scope and press Start.</div>')+`<div class="card"><h2>Failures needing attention</h2>${S.filter(s=>s.error).map(s=>`<p><b>${esc(s.name||s.url)}</b> <span class="chip errors">${esc(s.error.code)}</span><br><small>${esc(s.error.message)}</small></p>`).join('')||'<span class="sub">None.</span>'}</div>`}},
reports:{mount:()=>`<div class="top"><div><h1>Reports &amp; Activity Logs</h1></div><div class="row"><button class="btn p" data-a="exp">Export results CSV</button><button class="btn" data-a="expl">Export activity CSV</button></div></div><div id="d"></div><div class="card"><h2>Activity log</h2><div class="row" style="margin-bottom:10px"><input id="lq" type="search" placeholder="Search imports and checks" style="min-width:260px"><select id="lt"><option value="">All types</option>${['import','check','batch','add','edit','remove','settings','export'].map(t=>`<option>${t}</option>`).join('')}</select></div><div id="lg" class="w"></div></div>`,
 update:async()=>{const c=cnt(),m=Math.max(1,...Object.values(c).slice(1));$('d').innerHTML=`<div class="card"><h2>Completion breakdown (${c.all} students)</h2>${Object.keys(LBL).map(k=>`<div class="row" style="margin:6px 0"><span style="width:100px">${LBL[k]}</span><div class="bar" style="flex:1"><i style="width:${c[k]/m*100}%"></i></div><b>${c[k]}</b></div>`).join('')}</div>`;
  const l=await api(`/activity?q=${encodeURIComponent($('lq').value)}&type=${$('lt').value}`);$('lg').innerHTML=l.length?`<table><thead><tr><th>Time</th><th>Type</th><th>Student</th><th>Details</th></tr></thead><tbody>${l.map(x=>`<tr><td>${T(x.at)}</td><td>${x.type}</td><td>${esc(x.student)}</td><td${x.ok===false?' class="err"':''}>${esc(x.message)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No activity matches.</div>'}},
settings:{mount:()=>{const n=(k,l,min,max,u='')=>`<div><label>${l}</label><input type="number" id="s_${k}" min="${min}" max="${max}" value="${C[k]}"> ${u}</div>`,m=C.map||{};return`<div class="top"><div><h1>Settings</h1></div><button class="btn p" data-a="save">Save settings</button></div><div class="card"><h2>Campaign and verification</h2><div class="g2">${n('target','Badge target',1,100)}${n('delayMs','Delay between requests (ms)',500,30000)}${n('concurrency','Max concurrent requests (1–4)',1,4)}${n('timeoutMs','Request timeout (ms)',5000,60000)}${n('retries','Retry limit (0–5)',0,5)}</div><label><input type="checkbox" id="s_demo"${C.demo?' checked':''}> Demo mode: simulate checks from the mock CSV's badge-count column (no network requests)</label></div><div class="card"><h2>CSV column mapping</h2><p class="sub">Exact header names. Leave blank to auto-detect. You can also adjust these per upload.</p><div class="g2">${[['url','Profile URL'],['name','Name'],['email','Email'],['id','Student ID'],['notes','Notes'],['mock','Mock badge count']].map(([k,l])=>`<div><label>${l}</label><input id="m_${k}" value="${esc(m[k]||'')}"></div>`).join('')}</div></div><div class="card"><h2>Admin preferences</h2><div class="g2"><div><label>Chapter / organizer name</label><input id="s_chapter" value="${esc(C.chapter)}"></div>${n('pageSize','Rows per page',10,100)}${n('refreshSec','Auto-refresh (seconds)',2,60)}</div><label><input type="checkbox" id="s_utc"${C.utc?' checked':''}> Show times in UTC</label><label><input type="checkbox" id="s_confirm"${C.confirm?' checked':''}> Confirm before removing students</label><p><button class="btn d" data-a="clear">Remove all students</button></p></div>`},update:()=>{}}};

function route(){R=(location.hash.slice(2)||'dashboard');if(!P[R])R='dashboard';document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.hash==='#/'+R));$('v').innerHTML=P[R].mount();
 const f=$('f'),s=$('q');if(f)f.onchange=()=>{filt=f.value;page=1;P[R].update()};if(s)s.oninput=()=>{q=s.value;page=1;P[R].update()};
 for(const id of ['lq','lt'])if($(id))$(id).oninput=()=>P[R].update();P[R].update()}
const thl=()=>$('th').textContent=document.documentElement.dataset.theme==='dark'?'☀ Switch to light':'☾ Switch to dark';thl();
async function load(){try{const d=await api('/state');S=d.students;C=d.settings;J=d.job;$('tg').textContent=C.target;if(R!=='settings'||!$('s_target'))P[R].update()}catch{}clearTimeout(load.t);load.t=setTimeout(load,J.state==='running'?1200:(C.refreshSec||6)*1000)}

// ---------- import ----------
let CSV='';const dlg=$('dlg'),close='<div class="row" style="justify-content:flex-end;margin-top:14px">';
async function pv(map){const p=await api('/import/preview',{method:'POST',body:{csv:CSV,map}});const k=p.counts;
 dlg.innerHTML=`<h2>Preview import</h2><p><b>${k.total}</b> rows · <b>${k.valid}</b> valid · <b>${k.invalid}</b> invalid URL or missing data · <b>${k.dup}</b> duplicates (skipped)</p><div class="g2">${['url','name','email','id','notes','mock'].map(f=>`<div><label>${{url:'Profile URL',name:'Name',email:'Email',id:'Student ID',notes:'Notes',mock:'Mock badge count'}[f]}</label><select data-m="${f}"><option value="">(none)</option>${p.headers.map(h=>`<option${h===p.map[f]?' selected':''}>${esc(h)}</option>`).join('')}</select></div>`).join('')}</div><div class="w" style="max-height:260px;overflow:auto;margin-top:12px"><table><thead><tr><th>Row</th><th>Name</th><th>URL</th><th>Check</th></tr></thead><tbody>${p.rows.slice(0,150).map(r=>`<tr><td>${r.line}</td><td>${esc(r.name||r.email||r.studentId)}</td><td><small>${esc(r.url.slice(0,60))}</small></td><td>${r.valid?'<span class="chip completed">OK</span>':`<span class="err">${esc(r.issues.join('; '))}</span>`}</td></tr>`).join('')}</tbody></table></div>${p.rows.some(r=>/mock/i.test(r.notes))?'<div class="banner" style="margin-top:12px">These rows are marked MOCK DATA. Their URLs are placeholders. Turn on Demo mode in Settings to test, and do not verify them as real accounts.</div>':''}<label>Import mode</label><select id="im"><option value="merge">Merge (update matching students, keep results)</option><option value="replace">Replace all existing students</option></select><label><input type="checkbox" id="si"> Skip invalid rows (otherwise they import as Errors you can fix)</label><label><input type="checkbox" id="sm"> Save this mapping as the default</label>${close}<button class="btn" data-a="x">Cancel</button><button class="btn p" data-a="commit"${k.total?'':' disabled'}>Import</button></div>`;
 dlg.querySelectorAll('[data-m]').forEach(s=>s.onchange=go(()=>pv(Object.fromEntries([...dlg.querySelectorAll('[data-m]')].map(x=>[x.dataset.m,x.value])))));if(!dlg.open)dlg.showModal()}
const fm=s=>`<div class="g2"><div><label>Name</label><input id="e_name" value="${esc(s.name)}"></div><div><label>Student ID</label><input id="e_studentId" value="${esc(s.studentId)}"></div><div><label>Email</label><input id="e_email" value="${esc(s.email)}"></div><div><label>Profile URL</label><input id="e_url" value="${esc(s.url)}"></div></div><label>Notes</label><input id="e_notes" value="${esc(s.notes)}" style="width:100%">`;
const form=()=>Object.fromEntries(['name','studentId','email','url','notes'].map(k=>[k,$('e_'+k).value]));

document.addEventListener('click',go(async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.closest('tr')?.dataset.id,s=S.find(x=>x.id===id);
 const A={theme:()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.theme=t}catch{}thl()},refresh:()=>load(),vall:()=>verify('all'),start:()=>verify($('sc').value),vf:()=>verify('failed'),pause:()=>api('/job/pause',{method:'POST'}).then(load),resume:()=>api('/job/resume',{method:'POST'}).then(load),cancel:()=>api('/job/cancel',{method:'POST'}).then(load),
 up:()=>{const i=document.createElement('input');i.type='file';i.accept='.csv,text/csv';i.onchange=go(async()=>{CSV=await i.files[0].text();await pv(C.map)});i.click()},
